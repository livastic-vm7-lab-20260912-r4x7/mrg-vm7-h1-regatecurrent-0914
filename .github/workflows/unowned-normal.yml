name: VM7 current regate supported normal path proof
on:
  push:
    branches:
      - main
permissions:
  contents: write
  id-token: write
jobs:
  normal-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Repository secret binding proof
        shell: bash
        env:
          CANARY: ${{ secrets.REGATE_CANARY_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CANARY:-}"
          python3 - <<'PY'
          import hashlib, os
          secret = os.environ["CANARY"]
          sha = os.environ["GITHUB_SHA"]
          print("NORMAL_SECRET_PRESENT=yes")
          print("NORMAL_SECRET_BINDING_SHA256=" + hashlib.sha256((secret + ":" + sha).encode()).hexdigest())
          PY
      - name: OIDC claim proof
        shell: bash
        run: |
          set -euo pipefail
          R="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vm7-current-normal")"
          T="$(printf '%s' "$R" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          OIDC_JWT="$T" python3 -c 'import os,json,base64; s=os.environ["OIDC_JWT"].split(".")[1]; s += "=" * (-len(s) % 4); d=json.loads(base64.urlsafe_b64decode(s)); print("NORMAL_OIDC_REPO="+str(d.get("repository"))); print("NORMAL_OIDC_REF="+str(d.get("ref"))); print("NORMAL_OIDC_SHA="+str(d.get("sha"))); print("NORMAL_OIDC_ACTOR="+str(d.get("actor"))); print("NORMAL_OIDC_EVENT="+str(d.get("event_name"))); print("NORMAL_OIDC_AUD="+str(d.get("aud")))'
      - name: Repository write proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="vm7-current-normal-${GITHUB_SHA:0:12}"
          CODE="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" -d "{\"ref\":\"refs/heads/${BR}\",\"sha\":\"${GITHUB_SHA}\"}")"
          echo "NORMAL_WRITE_PROOF_BRANCH=${BR}"
          echo "NORMAL_WRITE_PROOF_HTTP=${CODE}"
          test "$CODE" = 201
# canonical-end
